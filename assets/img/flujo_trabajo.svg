<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220"
     font-family="'Helvetica Neue', Arial, sans-serif">

  <!-- Fondo -->
  <rect width="760" height="220" fill="#f8f8f8" rx="6"/>

  <!-- ── CAJA 1: Desarrollo en conda ── -->
  <rect x="20" y="40" width="180" height="140" rx="5"
        fill="#ffffff" stroke="#2d7dd2" stroke-width="1.5"/>
  <!-- encabezado azul -->
  <rect x="20" y="40" width="180" height="32" rx="5" fill="#2d7dd2"/>
  <rect x="20" y="58" width="180" height="14" fill="#2d7dd2"/>
  <text x="110" y="61" text-anchor="middle" fill="#ffffff"
        font-size="12" font-weight="600">Desarrollo</text>
  <!-- etiqueta conda -->
  <rect x="36" y="86" width="72" height="18" rx="3" fill="#e8f4ea" stroke="#4caf50" stroke-width="1"/>
  <text x="72" y="99" text-anchor="middle" fill="#2e7d32" font-size="10" font-weight="600">conda env</text>
  <!-- items -->
  <text x="36" y="124" fill="#333" font-size="10">• Jupyter notebooks</text>
  <text x="36" y="140" fill="#333" font-size="10">• pandas / scikit-learn</text>
  <text x="36" y="156" fill="#333" font-size="10">• iteración rápida</text>

  <!-- ── FLECHA 1→2 ── -->
  <line x1="202" y1="110" x2="258" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="103" text-anchor="middle" fill="#666" font-size="9">código</text>
  <text x="230" y="114" text-anchor="middle" fill="#666" font-size="9">validado</text>

  <!-- ── CAJA 2: requirements.txt ── -->
  <rect x="260" y="70" width="140" height="80" rx="5"
        fill="#ffffff" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="330" y="95" text-anchor="middle" fill="#444" font-size="11" font-weight="600">requirements.txt</text>
  <text x="330" y="113" text-anchor="middle" fill="#666" font-size="10">pandas==2.x</text>
  <text x="330" y="127" text-anchor="middle" fill="#666" font-size="10">scikit-learn==1.x</text>
  <text x="330" y="141" text-anchor="middle" fill="#666" font-size="10">pyarrow, ...</text>

  <!-- ── FLECHA 2→3 ── -->
  <line x1="402" y1="110" x2="458" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="103" text-anchor="middle" fill="#666" font-size="9">docker</text>
  <text x="430" y="114" text-anchor="middle" fill="#666" font-size="9">build</text>

  <!-- ── CAJA 3: Imagen Docker ── -->
  <rect x="460" y="40" width="180" height="140" rx="5"
        fill="#ffffff" stroke="#e05c24" stroke-width="1.5"/>
  <!-- encabezado naranja -->
  <rect x="460" y="40" width="180" height="32" rx="5" fill="#e05c24"/>
  <rect x="460" y="58" width="180" height="14" fill="#e05c24"/>
  <text x="550" y="61" text-anchor="middle" fill="#ffffff"
        font-size="12" font-weight="600">Despliegue</text>
  <!-- etiqueta docker -->
  <rect x="476" y="86" width="72" height="18" rx="3" fill="#fde8df" stroke="#e05c24" stroke-width="1"/>
  <text x="512" y="99" text-anchor="middle" fill="#b84011" font-size="10" font-weight="600">Docker image</text>
  <!-- items -->
  <text x="476" y="124" fill="#333" font-size="10">• reproducible</text>
  <text x="476" y="140" fill="#333" font-size="10">• PC / servidor VPS</text>
  <text x="476" y="156" fill="#333" font-size="10">• ejecución automática</text>

  <!-- ── Nota inferior ── -->
  <text x="380" y="200" text-anchor="middle" fill="#888" font-size="10" font-style="italic">
    El mismo requirements.txt alimenta el entorno conda y la imagen Docker
  </text>

  <!-- Definición de flecha -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

</svg>
