<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200"
     font-family="'Helvetica Neue', Arial, sans-serif">

  <!-- Fondo -->
  <rect width="820" height="200" fill="#f8f8f8" rx="6"/>

  <!-- ══════════════════════════════════════════════
       NODO 1 — Raspberry Pi (captura)
  ══════════════════════════════════════════════ -->
  <rect x="20" y="50" width="150" height="100" rx="5"
        fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <rect x="20" y="50" width="150" height="28" rx="5" fill="#3a3a3a"/>
  <rect x="20" y="65" width="150" height="13" fill="#3a3a3a"/>
  <text x="95" y="68" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Raspberry Pi 5</text>
  <text x="95" y="95"  text-anchor="middle" fill="#555" font-size="10">IMU  100 Hz</text>
  <text x="95" y="110" text-anchor="middle" fill="#555" font-size="10">GNSS   5 Hz</text>
  <text x="95" y="125" text-anchor="middle" fill="#555" font-size="10">Baro    5 Hz</text>
  <text x="95" y="143" text-anchor="middle" fill="#888" font-size="9" font-style="italic">→ CSV por sesión</text>

  <!-- FLECHA 1 → 2 -->
  <line x1="172" y1="100" x2="218" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="195" y="90"  text-anchor="middle" fill="#666" font-size="9">sincronizacion</text>
  <text x="195" y="101" text-anchor="middle" fill="#666" font-size="9">.py</text>
  <text x="195" y="113" text-anchor="middle" fill="#888" font-size="8">OAuth / MD5</text>

  <!-- ══════════════════════════════════════════════
       NODO 2 — Google Drive
  ══════════════════════════════════════════════ -->
  <rect x="220" y="50" width="150" height="100" rx="5"
        fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <rect x="220" y="50" width="150" height="28" rx="5" fill="#1a73e8"/>
  <rect x="220" y="65" width="150" height="13" fill="#1a73e8"/>
  <text x="295" y="68" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Google Drive</text>
  <text x="295" y="93"  text-anchor="middle" fill="#555" font-size="10">proyecto-gnss/</text>
  <text x="295" y="108" text-anchor="middle" fill="#777" font-size="10">  YYYYMMDD/</text>
  <text x="295" y="123" text-anchor="middle" fill="#999" font-size="9">    imu_*.csv</text>
  <text x="295" y="136" text-anchor="middle" fill="#999" font-size="9">    gnss_*.csv</text>
  <text x="295" y="149" text-anchor="middle" fill="#999" font-size="9">    baro_*.csv</text>

  <!-- FLECHA 2 → 3 -->
  <line x1="372" y1="100" x2="418" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="395" y="90"  text-anchor="middle" fill="#666" font-size="9">descargar</text>
  <text x="395" y="101" text-anchor="middle" fill="#666" font-size="9">_datos.py</text>
  <text x="395" y="113" text-anchor="middle" fill="#888" font-size="8">idempotente</text>

  <!-- ══════════════════════════════════════════════
       NODO 3 — PC local (análisis)
  ══════════════════════════════════════════════ -->
  <rect x="420" y="50" width="150" height="100" rx="5"
        fill="#ffffff" stroke="#2d7dd2" stroke-width="1.5"/>
  <rect x="420" y="50" width="150" height="28" rx="5" fill="#2d7dd2"/>
  <rect x="420" y="65" width="150" height="13" fill="#2d7dd2"/>
  <text x="495" y="68" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">PC — conda env</text>
  <text x="495" y="93"  text-anchor="middle" fill="#555" font-size="10">datos/YYYYMMDD/</text>
  <text x="495" y="108" text-anchor="middle" fill="#777" font-size="10">EDA · fusión</text>
  <text x="495" y="123" text-anchor="middle" fill="#777" font-size="10">features · modelo</text>
  <text x="495" y="143" text-anchor="middle" fill="#888" font-size="9" font-style="italic">Jupyter / scripts</text>

  <!-- FLECHA 3 → 4 -->
  <line x1="572" y1="100" x2="618" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="595" y="90"  text-anchor="middle" fill="#666" font-size="9">docker</text>
  <text x="595" y="101" text-anchor="middle" fill="#666" font-size="9">build/run</text>

  <!-- ══════════════════════════════════════════════
       NODO 4 — Docker / VPS
  ══════════════════════════════════════════════ -->
  <rect x="620" y="50" width="180" height="100" rx="5"
        fill="#ffffff" stroke="#e05c24" stroke-width="1.5"/>
  <rect x="620" y="50" width="180" height="28" rx="5" fill="#e05c24"/>
  <rect x="620" y="65" width="180" height="13" fill="#e05c24"/>
  <text x="710" y="68" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Docker — despliegue</text>
  <text x="710" y="93"  text-anchor="middle" fill="#555" font-size="10">pipeline reproducible</text>
  <text x="710" y="108" text-anchor="middle" fill="#777" font-size="10">PC  ·  VPS  ·  CI</text>
  <text x="710" y="128" text-anchor="middle" fill="#777" font-size="10">reportes automáticos</text>
  <text x="710" y="143" text-anchor="middle" fill="#888" font-size="9" font-style="italic">mismas dependencias</text>

  <!-- Nota inferior -->
  <text x="410" y="185" text-anchor="middle" fill="#888" font-size="10" font-style="italic">
    Los archivos CSV originales se conservan en Drive como fuente de verdad
  </text>

  <!-- Definición de flecha -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

</svg>
